<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Regular-Mouth Stainless Mason Lid with Built-In Honey Dipper  Kitchen Add-On</title>
  <desc id="desc">Placeholder product card for a regular-mouth stainless mason lid with built-in honey dipper. Not Hiveborn honey.</desc>
  <rect width="800" height="600" fill="#f4f4f5"/>
  <rect x="24" y="24" width="752" height="552" rx="36" fill="#ffffff" stroke="#a1a1aa" stroke-width="3"/>
  <rect x="48" y="48" width="230" height="40" rx="20" fill="#111827"/>
  <text x="163" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#e4e4e7">REGULAR-MOUTH</text>
  <text x="400" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#111827">Stainless Lid + Dipper</text>
  <text x="400" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#52525b">Kitchen add-on · fits ~70 mm regular-mouth jars</text>

  <g transform="translate(400 300)">
    <ellipse cx="0" cy="78" rx="78" ry="18" fill="#e4e4e7"/>
    <circle cx="0" cy="40" r="78" fill="#d4d4d8" stroke="#71717a" stroke-width="7"/>
    <circle cx="0" cy="40" r="52" fill="#fafafa"/>
    <rect x="-7" y="-118" width="14" height="150" rx="7" fill="#a16207"/>
    <ellipse cx="0" cy="-128" rx="18" ry="16" fill="#854d0e"/>
    <circle cx="-8" cy="-132" r="3" fill="#fef3c7"/>
  </g>

  <text x="400" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#3f3f46">Not Hiveborn honey · supplier dropships</text>
  <text x="400" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#71717a">Does not fit wide-mouth jars</text>
  <text x="400" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa">Placeholder graphic until product photos arrive</text>
